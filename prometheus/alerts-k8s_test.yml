  # S17 Frigate dead at startup: discovery exhausts 12x5s, exit(1), k8s restarts. up stays 1 (server binds before discovery), so Down/Unscrapeable cannot see it; no camera series exist, so no camera rule can fire; failed calls still count JSON, so rule 7 is silent. ProcessRestartLoop is what pages.
  - interval: 1m
    input_series:
      - series: up{instance="10.128.0.18:9108"}
        values: "1x45"
      - series: process_start_time_seconds{instance="10.128.0.18:9108"}
        values: "-600x1 0x1 60x2 150x1 240x2 390x2 540x36"
      - series: frigate_response_seconds_count{instance="10.128.0.18:9108",kind="json"}
        values: "0+12x2 12+12x3 48+12x5 108+12x9 216+12x26"
      - series: process_open_fds{instance="10.128.0.18:9108"}
        values: "12x45"
      - series: process_resident_memory_bytes{instance="10.128.0.18:9108"}
        values: "96075776x45"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProcessRestartLoop
        exp_alerts:
          - exp_labels:
              instance: "10.128.0.18:9108"
              severity: "critical"
            exp_annotations:
              summary: "The exporter restarted more than twice in 30 minutes"
              description: "Crash loop. In-flight uploads are lost but the watermark re-reads them - what degrades is time, not the archive. Check the container exit reason and the memory limit."
      - eval_time: 10m
        alertname: FrigateMotionExporterDown
        exp_alerts: []
      - eval_time: 10m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts: []
      - eval_time: 10m
        alertname: NoFrigateQueries
        exp_alerts: []
      - eval_time: 10m
        alertname: ArchiveTaskWedgedOrDead
        exp_alerts: []

