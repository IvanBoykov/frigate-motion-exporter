# promtool unit tests for alerts-k8s.yml.
# Run: promtool test rules prometheus/alerts-k8s_test.yml
#
# Each scenario feeds only metric shapes run_camera/supervise_camera
# can actually produce; the header states expected behavior and the
# minutes where it is pinned down.
rule_files:
  - alerts-k8s.yml
evaluation_interval: 1m
# The evaluation clock starts at zero, so process_start_time_seconds
# values are expressed relative to it (negative = started before the
# first sample), which is what age guards compare against.
tests:

  # S1 healthy 12 h, 2 cameras, pod restart at +3 h (4 min backoff, 8 min safe watermark regression, one process start): no rule fires, including the minutes right around the restart.
  - interval: 1m
    input_series:
      - series: up{instance="10.128.0.18:9108"}
        values: "1x720"
      - series: camera_task_running{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "1x180 0x2 1x538"
      - series: camera_motion_intervals_found{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0x720"
      - series: camera_consecutive_failures{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0x180 1 2 0x538"
      - series: camera_watermark_timestamp_seconds{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "-120+60x179 10140+120x2 10380+60x536"
      - series: clips_uploaded_total{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0+1x720"
      - series: camera_task_running{camera="yard_cam",instance="10.128.0.18:9108"}
        values: "1x180 0x2 1x538"
      - series: camera_motion_intervals_found{camera="yard_cam",instance="10.128.0.18:9108"}
        values: "0x720"
      - series: camera_consecutive_failures{camera="yard_cam",instance="10.128.0.18:9108"}
        values: "0x180 1 2 0x538"
      - series: camera_watermark_timestamp_seconds{camera="yard_cam",instance="10.128.0.18:9108"}
        values: "-120+60x179 10140+120x2 10380+60x536"
      - series: clips_uploaded_total{camera="yard_cam",instance="10.128.0.18:9108"}
        values: "0+1x720"
      - series: process_start_time_seconds{instance="10.128.0.18:9108"}
        values: "-43200x180 180x540"
      - series: process_open_fds{instance="10.128.0.18:9108"}
        values: "12x720"
      - series: process_resident_memory_bytes{instance="10.128.0.18:9108"}
        values: "96075776x720"
      - series: frigate_response_seconds_count{instance="10.128.0.18:9108",kind="json"}
        values: "0+2x720"
      - series: frigate_response_seconds_count{instance="10.128.0.18:9108",kind="clip_ttfb"}
        values: "0+2x720"
