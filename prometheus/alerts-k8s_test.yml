  # S2 pod deleted/never scheduled: no target, hence no up series. Unscrapeable fires; up==0 stays silent - the hole the absent_over_time arm closes.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 2m
        alertname: FrigateMotionExporterDown
        exp_alerts: []
      - eval_time: 2m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts: []
      - eval_time: 3m
        alertname: FrigateMotionExporterDown
        exp_alerts: []
      - eval_time: 3m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "The Frigate motion exporter exports no metrics at all"
              description: "Not a single exporter metric for 3 minutes: the pod is deleted, not ready, or crash-looping (CrashLoopBackOff). This is what up == 0 cannot see."
      - eval_time: 6m
        alertname: FrigateMotionExporterDown
        exp_alerts: []
      - eval_time: 6m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "The Frigate motion exporter exports no metrics at all"
              description: "Not a single exporter metric for 3 minutes: the pod is deleted, not ready, or crash-looping (CrashLoopBackOff). This is what up == 0 cannot see."

  # S3 target still listed, /metrics stops answering: Down fires, Unscrapeable fires too (no exporter metric series at all).
  - interval: 1m
    input_series:
      - series: up{instance="10.128.0.18:9108"}
        values: "1x10 0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: FrigateMotionExporterDown
        exp_alerts: []
      - eval_time: 5m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "The Frigate motion exporter exports no metrics at all"
              description: "Not a single exporter metric for 3 minutes: the pod is deleted, not ready, or crash-looping (CrashLoopBackOff). This is what up == 0 cannot see."
      - eval_time: 15m
        alertname: FrigateMotionExporterDown
        exp_alerts:
          - exp_labels:
              instance: "10.128.0.18:9108"
              severity: "critical"
            exp_annotations:
              summary: "Frigate motion exporter target is not responding"
              description: "The scrape target answers with up == 0 for more than 3 minutes. While this fires the archive is unobservable - assume it is not growing until proven otherwise."
      - eval_time: 15m
        alertname: FrigateMotionExporterUnscrapeable
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "The Frigate motion exporter exports no metrics at all"
              description: "Not a single exporter metric for 3 minutes: the pod is deleted, not ready, or crash-looping (CrashLoopBackOff). This is what up == 0 cannot see."

  # S4 S3 blackhole wedging the watermark read: WedgedOrDead fires at 24m+, NoFrigateQueries at ~21m (JSON and clip counters both frozen - nothing is being downloaded either). Stalled and Lag stay silent BY DESIGN (the watermark series was never exported, nothing to match) - this pair is the coverage for that state.
  - interval: 1m
    input_series:
      - series: up{instance="10.128.0.18:9108"}
        values: "1x90"
      - series: camera_task_running{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0x90"
      - series: camera_consecutive_failures{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0x1 0x89"
      - series: camera_motion_intervals_found{camera="dacha_cam",instance="10.128.0.18:9108"}
        values: "0x90"
      - series: frigate_response_seconds_count{instance="10.128.0.18:9108",kind="json"}
        values: "0+1x1 1x89"
      - series: process_start_time_seconds{instance="10.128.0.18:9108"}
        values: "-43200x90"
      - series: process_open_fds{instance="10.128.0.18:9108"}
        values: "12x90"
      - series: process_resident_memory_bytes{instance="10.128.0.18:9108"}
        values: "96075776x90"
    alert_rule_test:
      - eval_time: 26m
        alertname: ArchiveTaskWedgedOrDead
        exp_alerts:
          - exp_labels:
              camera: "dacha_cam"
              instance: "10.128.0.18:9108"
              severity: "critical"
            exp_annotations:
              summary: "Camera task did not run a single minute in 15 minutes (dacha_cam)"
              description: "camera_task_running did not go to 1 even once in 15 minutes - the supervisor's restart backoff is far shorter than that -, the process is older than 15 minutes, and the state has held for another 10 minutes. There are exactly three causes: the supervisor is in backoff, the task is wedged reading the watermark from an S3 that does not answer, or the task never started. Look at errors_total{camera=\"dacha_cam\"} and CameraInDeepBackoff."
      - eval_time: 26m
        alertname: ArchiveStalledWithMotion
        exp_alerts: []
      - eval_time: 26m
        alertname: ArchiveLagHigh
        exp_alerts: []
      - eval_time: 26m
        alertname: NoFrigateQueries
        exp_alerts:
          - exp_labels:
              instance: "10.128.0.18:9108"
              kind: "json"
              severity: "critical"
            exp_annotations:
              summary: "The exporter neither queries Frigate nor downloads clips for 20 minutes"
              description: "No JSON query to Frigate for 15 minutes and no clip downloaded over the same 15 minutes, the state holding for 5+ minutes. This is not catch-up: during catch-up the JSON counter is silent while clip_ttfb grows. The process may still answer scrapes and look alive by up. Typical cause - all camera tasks wedged (S3 blackhole) or dead; see ArchiveTaskWedgedOrDead and errors_total."
      - eval_time: 60m
        alertname: ArchiveTaskWedgedOrDead
        exp_alerts:
          - exp_labels:
              camera: "dacha_cam"
              instance: "10.128.0.18:9108"
              severity: "critical"
            exp_annotations:
              summary: "Camera task did not run a single minute in 15 minutes (dacha_cam)"
              description: "camera_task_running did not go to 1 even once in 15 minutes - the supervisor's restart backoff is far shorter than that -, the process is older than 15 minutes, and the state has held for another 10 minutes. There are exactly three causes: the supervisor is in backoff, the task is wedged reading the watermark from an S3 that does not answer, or the task never started. Look at errors_total{camera=\"dacha_cam\"} and CameraInDeepBackoff."
      - eval_time: 60m
        alertname: ArchiveStalledWithMotion
        exp_alerts: []
      - eval_time: 60m
        alertname: ArchiveLagHigh
        exp_alerts: []
      - eval_time: 60m
        alertname: NoFrigateQueries
        exp_alerts:
          - exp_labels:
              instance: "10.128.0.18:9108"
              kind: "json"
              severity: "critical"
            exp_annotations:
              summary: "The exporter neither queries Frigate nor downloads clips for 20 minutes"
              description: "No JSON query to Frigate for 15 minutes and no clip downloaded over the same 15 minutes, the state holding for 5+ minutes. This is not catch-up: during catch-up the JSON counter is silent while clip_ttfb grows. The process may still answer scrapes and look alive by up. Typical cause - all camera tasks wedged (S3 blackhole) or dead; see ArchiveTaskWedgedOrDead and errors_total."

  # S5 rolling update, two pods: young wedged pod A is guarded by ITS OWN age, not pod B's (with and on() pod B suppressed A forever). Silent at 20m (A younger than 15 min), fires at ~30m on A alone.
  - interval: 1m
    input_series:
      - series: up{instance="10.128.0.19:9108"}
